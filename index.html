<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webアプリ開発 基礎知識クイズ</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script> 
</head>
<body>
  <div class="quiz-container">
    <h1>Web開発 基礎クイズ</h1>

    <!-- 認証エリア（新規登録・ログイン） -->
    <div id="auth-screen">
      <h2 id="auth-title">ログイン / 新規登録</h2>
      <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1rem;">
        <input type="email" id="auth-email" placeholder="メールアドレス" style="padding: 0.8rem; font-size: 1rem;">
        <input type="password" id="auth-password" placeholder="パスワード" style="padding: 0.8rem; font-size: 1rem;">
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button onclick="handleLogin()" class="option-btn" style="flex: 1; text-align: center;">ログイン</button>
        <button onclick="handleRegister()" class="option-btn" style="flex: 1; text-align: center; background: #e0f0ff;">新規登録</button>
      </div>
      <p id="auth-message" style="color: red; margin-top: 1rem; text-align: center;"></p>
    </div>

    <!-- スタート画面（ログイン成功まで非表示） -->
    <div id="start-screen" style="display: none;">
      <p id="user-welcome" style="text-align: center; font-weight: bold; margin-bottom: 1rem;"></p>
      <p style="text-align: center; margin-bottom: 1.5rem;">挑戦するカテゴリを選択してください</p>
      <div class="options">
        <button class="option-btn" onclick="startQuiz('all')">全カテゴリ（ランダム）</button>
        <button class="option-btn" onclick="startQuiz('html-css')">HTML / CSS編</button>
        <button class="option-btn" onclick="startQuiz('js')">JavaScript編</button>
        <button class="option-btn" onclick="startQuiz('git-infra')">Git / インフラ編</button>
      </div>
    </div>
    
    <!-- クイズ画面 -->
    <div id="quiz-screen" style="display: none;">
      <div class="progress" id="progress">問題 1 / 5</div>
      <div class="timer" id="timer">残り時間: 10秒</div>
      <div class="question" id="question">問題を読み込み中...</div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
      <button id="next-btn" class="next-btn" style="display: none;">次の問題へ</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" style="display: none;">
      <h2>結果発表</h2>
      <p class="score" id="score"></p>
      <p class="high-score" id="high-score"></p>
      <button onclick="location.reload()" class="restart-btn">もう一度挑戦する</button>
    </div>
  </div>
</body>
</html>
